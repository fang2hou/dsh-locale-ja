name: PR title check

# Owns the pull-request-only audience: the Conventional Commits title gate.
# Kept out of CI (push + pull_request) so push-triggered runs never show a
# skipped title job; `edited` revalidates retitled PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Configure git identity (required by cog)
        run: |
          git config --global user.name "pr-title-check"
          git config --global user.email "pr-title-check@users.noreply.github.com"

      - name: Verify PR title (cog)
        run: cog verify "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
