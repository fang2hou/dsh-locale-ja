name: Release

# Publishes to npm on a pushed `v*` tag using trusted publishing (OIDC) — no
# npm token secret; the tag is the single source of truth for the version.
# Prerequisites and the manual first publish: DEVELOPMENT.md -> Releasing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Check (typecheck / lint / format / build / test)
        run: mise run check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E against real DSH web (Docker + Playwright)
        run: mise run e2e

      # Runs after the checks: `npm version` rewrites package.json, which must
      # not trip `mise run check`'s format gate.
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish
