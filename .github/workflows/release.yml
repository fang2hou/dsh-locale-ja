name: Release

# Publishes the plugin package to the public npm registry when a version tag
# (`v*`) is pushed, using npm trusted publishing (OIDC). No npm token is stored
# as a secret. The pushed tag is the single source of truth for the version:
# package.json is stamped from it before publishing, so a tag can never ship a
# stale or mismatched package version.
#
# npm is the install channel, not just distribution: users install with
# `dsh plugin --profile web add @fang2hou/dsh-locale-ja`, which reconciles the
# package into the profile's bundle list (see docs/adr/0005).
#
# Prerequisite: a trusted publisher for `@fang2hou/dsh-locale-ja` must be
# configured on npmjs.com (package Settings -> Trusted publishing -> GitHub
# Actions) pointing at this repository and this workflow filename
# (`release.yml`). npm trusted publishing requires the package to already
# exist, so the first version is published manually once — see
# DEVELOPMENT.md -> Releasing.
#
# Requires npm CLI >= 11.5.1 (Node 24, provisioned by mise, satisfies this).
# Provenance is attached automatically by trusted publishing (no flag needed).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Check (typecheck / lint / format / build / test)
        run: mise run check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E against real DSH web (Docker + Playwright)
        run: mise run e2e

      # Stamp the version from the tag (e.g. v0.2.1 -> 0.2.1). Runs after the
      # checks: `npm version` rewrites package.json, which must not trip
      # `mise run check`'s format gate; the build does not embed the version,
      # and `npm publish` re-runs `prepack` (build) regardless.
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Tokenless: npm CLI (>= 11.5.1) auto-detects the GitHub Actions OIDC
      # environment and exchanges it for a short-lived publish credential.
      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish
