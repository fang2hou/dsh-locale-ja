name: E2E latest DSH

# Twice a day, verify the plugin against the registry's latest
# @deepseek-ai/dsh — dictionary drift plus a full e2e — so an upstream release
# that breaks the plugin or strands Japanese keys turns a scheduled run red
# instead of waiting for the next manual upgrade.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH version under test (exact version, or 'latest')"
        required: false
        default: "latest"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream:
    name: dictionary drift + e2e (latest DSH)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Resolve DSH version under test
        id: dsh
        run: |
          version=$(node scripts/dsh-version.ts "$DSH_VERSION_SPEC")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          DSH_VERSION_SPEC: ${{ inputs.dsh_version || 'latest' }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser (chromium)
        run: mise run playwright

      # Both checks run even when the first fails (`if: !cancelled()`): the
      # drift result plus the e2e result together say whether the fix is a
      # dictionary refresh or an adapter change.
      - name: Check dictionary drift (@deepseek-ai/dsh@${{ steps.dsh.outputs.version }})
        if: ${{ !cancelled() }}
        run: mise run drift -- --dsh "$DSH_VERSION"
        env:
          DSH_VERSION: ${{ steps.dsh.outputs.version }}

      - name: Run e2e (@deepseek-ai/dsh@${{ steps.dsh.outputs.version }})
        if: ${{ !cancelled() }}
        run: mise run e2e
        env:
          DSH_E2E_DSH_VERSION: ${{ steps.dsh.outputs.version }}

      - name: Write upstream watch summary
        if: ${{ always() }}
        run: |
          {
            echo "## Upstream watch"
            echo "- DSH under test: \`@deepseek-ai/dsh@${DSH_VERSION}\`"
            echo "- Checked: dictionary drift (scripts/check-dict-drift.ts), Docker + Playwright e2e (e2e/)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DSH_VERSION: ${{ steps.dsh.outputs.version }}
