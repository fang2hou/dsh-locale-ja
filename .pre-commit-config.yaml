repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: pnpm
        args: ["--silent", "lint"]
        language: system
        types: ["ts"]
        pass_filenames: false

      - id: oxfmt
        name: oxfmt (check)
        entry: pnpm
        args: ["--silent", "format:check"]
        language: system
        types: ["ts"]
        pass_filenames: false

      - id: typecheck
        name: tsc (typecheck)
        entry: pnpm
        args: ["--silent", "typecheck"]
        language: system
        types: ["ts"]
        pass_filenames: false
        stages: [pre-push]

      - id: gitleaks
        name: gitleaks (staged diff)
        entry: gitleaks
        args: ["git", "--staged", "--pre-commit", "--redact", "--no-banner"]
        language: system
        pass_filenames: false

      - id: actionlint
        name: actionlint (github workflows)
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

  - repo: local
    hooks:
      - id: cog-verify
        name: conventional commits (cocogitto)
        entry: ./scripts/cog-verify-hook.sh
        language: script
        stages: [commit-msg]
