# mise is the single source of truth for runtime, CLI tool versions, and tasks.
# Install/activate everything: `mise install` then `mise run install`.
# https://mise.jdx.dev/

[tools]
node = "24"
pnpm = "11"
cocogitto = "7"
prek = "0.4"
gitleaks = "8"

# --- Common project tasks (the project-level task interface) ---
# Frontend work delegates to pnpm scripts; mise is the stable entry point.

[tasks.install]
description = "Install Node dependencies with pnpm."
run = "pnpm install"

[tasks.typecheck]
description = "Type-check the TypeScript sources (no emit)."
run = "pnpm typecheck"

[tasks.lint]
description = "Lint with oxlint."
run = "pnpm lint"

[tasks.format]
description = "Format sources with oxfmt."
run = "pnpm format"

[tasks.format-check]
description = "Verify sources are formatted with oxfmt."
run = "pnpm format:check"

[tasks.build]
description = "Build the plugin package into lib/ (Host half, browser bundle, declarations)."
run = "pnpm build"

[tasks.test]
description = "Run the browser-bundle integration test (requires a fresh build)."
depends = ["build"]
run = "pnpm test"

[tasks.e2e]
description = "Run the Docker + Playwright E2E suite against a real DSH web (requires Docker)."
run = "pnpm e2e"

[tasks.e2e-latest]
description = "Run the E2E suite against the npm registry's latest @deepseek-ai/dsh (requires Docker)."
run = "pnpm e2e:latest"

[tasks.dev]
description = "Start (or reuse) a local DSH web in Docker with this repo hot-linked as the plugin, then watch src/ and rebuild — DSH HMR swaps changes into the open page. Prints the URL."
run = "node scripts/dev-env.ts start"

[tasks.dev-stop]
description = "Remove the local dev DSH web container (mise run dev to recreate)."
run = "node scripts/dev-env.ts stop"

[tasks.dev-restart]
description = "Restart DSH inside the dev container (for loader-level changes; the watcher restarts automatically for cordis.patch.yml/package.json)."
run = "node scripts/dev-env.ts restart"

[tasks.dev-logs]
description = "Follow the dev container logs."
run = "node scripts/dev-env.ts logs"

[tasks.drift]
description = "Check the Japanese dictionaries against a DSH version's shipped locale keys (default: latest; pass -- --dsh <version> to pin)."
run = "pnpm drift"

[tasks.check]
description = "Run the full local validation workflow (typecheck, lint, format, build, test)."
depends = ["typecheck", "lint", "format-check", "build", "test"]

[tasks.clean]
description = "Remove build output."
run = "rm -rf lib"
